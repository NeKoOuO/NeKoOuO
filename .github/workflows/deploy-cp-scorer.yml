name: Deploy CP Scorer PWA

on:
  push:
    branches: [main]
    paths: [cp-scorer/**, .github/workflows/deploy-cp-scorer.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cp-scorer/package-lock.json
      - run: npm ci
        working-directory: cp-scorer
      - run: npm run build
        working-directory: cp-scorer
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: cp-scorer/dist
          force_orphan: true

name: Deploy CP Scorer PWA

on:
  push:
    branches: [main]
    paths: [cp-scorer/**, .github/workflows/deploy-cp-scorer.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cp-scorer/package-lock.json
      - run: npm ci
        working-directory: cp-scorer
      - run: npm run build
        working-directory: cp-scorer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cp-scorer/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
